name: Sync Hugging Face Space <-> GitHub Repo

# Ablegen unter: NemesisCyberForce/bulkScam/.github/workflows/sync-hf.yml
# Benötigtes Secret (im selben Repo): PULL_HF_GIT_TOKEN  (Hugging Face Token mit WRITE-Recht auf den Space)
#
# HF -> GitHub : legt einen NEUEN Branch "<name>-JJJJ-MM-TT" an (Standard: import-2026-11-21).
#                main/master/Standard-Branch werden nur mit gesetzter Bestätigung überschrieben.
# GitHub -> HF : pusht den angegebenen GitHub-Branch per Force-Push auf HF main (immer mit Bestätigung).

on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'Synchronisations-Richtung'
        required: true
        type: choice
        options:
          - 'HF -> GitHub'
          - 'GitHub -> HF'
      hf_repo:
        description: 'Hugging Face Space (z. B. Alibrown/BulkScam)'
        required: true
        default: 'Alibrown/BulkScam'
        type: string
      branch_name:
        description: 'HF->GitHub: Basisname des neuen Branches. GitHub->HF: Quell-Branch (muss existieren)'
        required: false
        default: 'import'
        type: string
      add_date:
        description: 'HF->GitHub: Datum an Branch-Namen anhängen (import-2026-11-21)'
        required: false
        default: true
        type: boolean
      confirm_main:
        description: 'ACHTUNG: Haken setzen, wenn main überschrieben werden darf (GitHub main bzw. HF main)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.PULL_HF_GIT_TOKEN }}
      HF_REPO_RAW: ${{ inputs.hf_repo }}
      DIRECTION: ${{ inputs.direction }}
      BRANCH_INPUT: ${{ inputs.branch_name }}
      ADD_DATE: ${{ inputs.add_date }}
      CONFIRM_MAIN: ${{ inputs.confirm_main }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      # 1. Standard-Branch dieses Repos auschecken (eingebauter github.token, kein PAT nötig).
      #    Der Ziel-Branch muss deshalb NICHT existieren.
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 2. HF-Token prüfen
      - name: Preflight (HF Token prüfen)
        run: |
          HF_REPO="${HF_REPO_RAW%/}"
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret PULL_HF_GIT_TOKEN ist leer oder nicht vorhanden (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/${HF_REPO}")
          echo "HF API Status für ${HF_REPO}: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::HF-Token hat keinen Zugriff auf den Space (Status $CODE). Space-Name und Token-Rechte prüfen."
            exit 1
          fi

      # 3. Ziel-Branch bestimmen + main-Schutz
      - name: Branch bestimmen und main-Schutz
        run: |
          set -euo pipefail
          BASE="${BRANCH_INPUT:-import}"
          BASE="${BASE// /-}"
          DATE_PART="$(TZ=Europe/Berlin date +%Y-%m-%d)"
          TIME_PART="$(TZ=Europe/Berlin date +%H%M)"

          is_protected() {
            [ "$1" = "main" ] || [ "$1" = "master" ] || [ "$1" = "$DEFAULT_BRANCH" ]
          }

          if [ "$DIRECTION" = "HF -> GitHub" ]; then
            if is_protected "$BASE"; then
              TARGET="$BASE"
              if [ "$CONFIRM_MAIN" != "true" ]; then
                echo "::error::WARNUNG: '$TARGET' würde mit dem HF-Stand ÜBERSCHRIEBEN. Zum Bestätigen 'confirm_main' ankreuzen oder einen anderen Branch-Namen (z. B. import) wählen."
                exit 1
              fi
              echo "::warning::ACHTUNG: GitHub-Branch '$TARGET' wird mit dem Stand von Hugging Face überschrieben!"
            else
              TARGET="$BASE"
              if [ "$ADD_DATE" = "true" ]; then
                TARGET="${BASE}-${DATE_PART}"
                # Gleicher Tag schon vergeben? Dann Uhrzeit anhängen.
                if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
                  TARGET="${TARGET}-${TIME_PART}"
                fi
              fi
            fi
            echo "TARGET_BRANCH=$TARGET" >> "$GITHUB_ENV"
            echo "### Import-Ziel: \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Ziel-Branch: $TARGET"
          else
            # GitHub -> HF: Quell-Branch muss existieren, HF main wird immer überschrieben
            if ! git rev-parse --verify --quiet "origin/$BASE" >/dev/null; then
              echo "::error::Quell-Branch '$BASE' existiert auf GitHub nicht. Vorhandene Branches:"
              git branch -r
              exit 1
            fi
            if [ "$CONFIRM_MAIN" != "true" ]; then
              echo "::error::WARNUNG: HF main wird per Force-Push ÜBERSCHRIEBEN. Zum Bestätigen 'confirm_main' ankreuzen."
              exit 1
            fi
            echo "::warning::ACHTUNG: HF Space main wird mit GitHub-Branch '$BASE' überschrieben (Force-Push)!"
            echo "SOURCE_BRANCH=$BASE" >> "$GITHUB_ENV"
          fi

      # -----------------------------------------------------------
      # FALL A: HF -> GitHub
      # -----------------------------------------------------------
      - name: Sync HF Space -> GitHub
        if: ${{ inputs.direction == 'HF -> GitHub' }}
        run: |
          set -euo pipefail
          HF_REPO="${HF_REPO_RAW%/}"
          echo "Synchronisiere: HF (${HF_REPO}) -> GitHub (${GITHUB_REPOSITORY}, Branch ${TARGET_BRANCH})"

          # Branch bestehend übernehmen oder neu anlegen (vom Standard-Branch aus)
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            echo "Branch '$TARGET_BRANCH' existiert noch nicht -> wird neu erstellt."
            git checkout -b "$TARGET_BRANCH"
          fi

          rm -rf /tmp/hf_tmp
          git clone --depth=1 "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_REPO}" /tmp/hf_tmp

          # .git und .github bleiben unangetastet (github.token darf keine Workflow-Dateien ändern)
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/hf_tmp/ ./

          git add -A
          if git diff --staged --quiet; then
            echo "Keine Änderungen gegenüber dem Ausgangsstand."
            # Neuen Branch trotzdem anlegen, damit der Import sichtbar ist
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
            exit 0
          fi

          git commit -m "Import from Hugging Face Space ${HF_REPO} ($(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M'))"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      # -----------------------------------------------------------
      # FALL B: GitHub -> HF
      # -----------------------------------------------------------
      - name: Sync GitHub -> HF Space
        if: ${{ inputs.direction == 'GitHub -> HF' }}
        run: |
          set -euo pipefail
          HF_REPO="${HF_REPO_RAW%/}"
          echo "Synchronisiere: GitHub (${SOURCE_BRANCH}) -> HF Space (${HF_REPO})"

          git checkout -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"
          git lfs install
          git remote remove hf 2>/dev/null || true
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_REPO}"

          git push -f hf "HEAD:refs/heads/main"
